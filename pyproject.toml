[project]
name = "sensor-trace"
version = "0.1.0"
description = "Cumulative store sales, drawn as a line with Matplotlib."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "matplotlib @ git+https://github.com/tjws052009/matplotlib_test.git@0fac93bb4397f83ee4ca2afe09ce7371f746711e",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[project.scripts]
sales-chart = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
